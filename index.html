<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>学生信息登记</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; color: #172554; background: #eff6ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px 14px; }
    main { width: min(100%, 520px); }
    .card { background: #fff; border-radius: 22px; overflow: hidden; box-shadow: 0 12px 36px #1e3a8a20; }
    header { padding: 28px 24px 25px; color: white; background: linear-gradient(135deg, #2563eb, #0ea5e9); }
    h1 { margin: 0; font-size: 25px; letter-spacing: .02em; }
    header p { margin: 9px 0 0; font-size: 15px; opacity: .94; line-height: 1.6; }
    section { padding: 25px 24px 28px; }
    h2 { font-size: 18px; margin: 0 0 10px; }
    .note { color: #475569; font-size: 14px; line-height: 1.65; margin: 0 0 20px; }
    a.button { display: block; width: 100%; text-decoration: none; text-align: center; padding: 15px 18px; border-radius: 12px; color: #fff; background: #2563eb; font-size: 17px; font-weight: 700; box-shadow: 0 5px 10px #2563eb33; }
    a.button:active { transform: translateY(1px); }
    .privacy { margin: 22px 0 0; color: #64748b; font-size: 13px; text-align: center; line-height: 1.6; }
    footer { color: #64748b; font-size: 12px; text-align: center; padding: 16px 0 0; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <header>
        <h1>学生信息登记</h1>
        <p>请如实填写。提交后会由老师统一统计。</p>
      </header>
      <section>
        <h2>填写前请准备好</h2>
        <p class="note">学号、姓名、性别、年龄、身高、体重、手机号码，以及需要补充的备注。</p>
        <!-- 把下面 #google-form-link 替换为 Google 表单“发送”中复制的公开链接。 -->
        <a id="formLink" class="button" href="#google-form-link" target="_blank" rel="noopener">开始填写</a>
        <p class="privacy">请勿代填他人信息。提交后如需修改，请联系老师。</p>
      </section>
    </div>
    <footer>学生信息登记 · 请使用手机浏览器打开</footer>
  </main>
  <script>
    // 收到 Google 表单链接后，把它粘贴到引号中即可。
    const googleFormUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSfb8CKIjPTzxFUJOX1RmOtZHDs4-vLaT5ok0aFyMnZ6mVCkSQ/viewform?usp=publish-editor';
    if (googleFormUrl) document.getElementById('formLink').href = googleFormUrl;
  </script>
</body>
</html>
